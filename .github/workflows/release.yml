name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Compile release binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p panel-agent -p panel-api -p panel-cli
          else
            cargo build --release --target ${{ matrix.target }} -p panel-agent -p panel-api -p panel-cli
          fi

      - name: Package tarball and checksum
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          STAGE_NAME="nusa-panel-${VERSION}-${{ matrix.target }}"
          mkdir -p release/${STAGE_NAME}/bin
          mkdir -p release/${STAGE_NAME}/templates/systemd

          cp target/${{ matrix.target }}/release/panel-agent release/${STAGE_NAME}/bin/
          cp target/${{ matrix.target }}/release/panel-api release/${STAGE_NAME}/bin/
          cp target/${{ matrix.target }}/release/panelctl release/${STAGE_NAME}/bin/
          chmod 0755 release/${STAGE_NAME}/bin/*

          cp templates/systemd/*.service release/${STAGE_NAME}/templates/systemd/
          cp install.sh uninstall.sh release/${STAGE_NAME}/
          chmod 0755 release/${STAGE_NAME}/install.sh release/${STAGE_NAME}/uninstall.sh

          if [ -d web/dist ]; then
            mkdir -p release/${STAGE_NAME}/web
            cp -r web/dist release/${STAGE_NAME}/web/
          fi

          tar -czf release/${STAGE_NAME}.tar.gz -C release ${STAGE_NAME}
          (cd release && sha256sum ${STAGE_NAME}.tar.gz > ${STAGE_NAME}.tar.gz.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-panel-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and unified SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cat {} + > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
