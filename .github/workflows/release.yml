name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: target/release-native/${{ matrix.target }}
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependency sources only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-native-glibc235-v1
          key: ${{ matrix.target }}
          cache-targets: 'false'
          cache-bin: 'false'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Compile release binaries
        run: bash scripts/compile-release.sh "${{ matrix.target }}"

      - name: Verify supported GLIBC baseline
        run: |
          bash scripts/check-glibc.sh "$CARGO_TARGET_DIR/${{ matrix.target }}/release/panel-api" "$CARGO_TARGET_DIR/${{ matrix.target }}/release/panel-agent" "$CARGO_TARGET_DIR/${{ matrix.target }}/release/panelctl"

      - name: Package tarball and checksum
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION:-$GITHUB_REF_NAME}"
          STAGE_NAME="nusa-panel-${VERSION}-${{ matrix.target }}"
          mkdir -p release/${STAGE_NAME}/bin
          mkdir -p release/${STAGE_NAME}/templates/systemd
          mkdir -p release/${STAGE_NAME}/templates/nginx

          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/panel-agent" release/${STAGE_NAME}/bin/
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/panel-api" release/${STAGE_NAME}/bin/
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/panelctl" release/${STAGE_NAME}/bin/
          chmod 0755 release/${STAGE_NAME}/bin/*

          cp templates/systemd/*.service release/${STAGE_NAME}/templates/systemd/
          cp templates/nginx/nusa-panel.conf release/${STAGE_NAME}/templates/nginx/
          cp install.sh uninstall.sh release/${STAGE_NAME}/
          chmod 0755 release/${STAGE_NAME}/install.sh release/${STAGE_NAME}/uninstall.sh

          if [ -d web/dist ]; then
            mkdir -p release/${STAGE_NAME}/web
            cp -r web/dist release/${STAGE_NAME}/web/
          fi

          tar -czf release/${STAGE_NAME}.tar.gz -C release ${STAGE_NAME}
          (cd release && sha256sum ${STAGE_NAME}.tar.gz > ${STAGE_NAME}.tar.gz.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nusa-panel-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release files and unified SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cat {} + > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
