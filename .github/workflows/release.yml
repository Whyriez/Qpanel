name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v1.0.0)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: target/release-native/${{ matrix.target }}
      CARGO_INCREMENTAL: '0'
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate release version
        run: bash scripts/package-release.sh "$RELEASE_TARGET" "$RELEASE_VERSION" --check-version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependency sources only
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-native-glibc235-v1
          key: ${{ matrix.target }}
          cache-targets: 'false'
          cache-bin: 'false'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Compile release binaries
        run: bash scripts/compile-release.sh "$RELEASE_TARGET"

      - name: Verify supported GLIBC baseline
        run: |
          bash scripts/check-glibc.sh "$CARGO_TARGET_DIR/$RELEASE_TARGET/release/panel-api" "$CARGO_TARGET_DIR/$RELEASE_TARGET/release/panel-agent" "$CARGO_TARGET_DIR/$RELEASE_TARGET/release/panelctl"

      - name: Package tarball and checksum
        run: |
          bash scripts/package-release.sh "$RELEASE_TARGET" "$RELEASE_VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nusa-panel-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release files and unified SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cat {} + > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
